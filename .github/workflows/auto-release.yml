name: Auto release

# Merge to main cuts a GitHub Release. This repo is the Neovim config itself;
# the contributor image mounts it at ~/.config/nvim (no nested MU_VIM_REF clone).
#
# feat: / fix: / perf: bump minor. A BREAKING CHANGE footer bumps major.
# Everything else, including a missing prefix, bumps patch.
# Put [skip release] in the merge commit body to publish nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [ -z "$latest" ]; then
            major=0
            minor=1
            patch=0
            range="HEAD"
          else
            major="${latest#v}"
            minor="${major#*.}"
            patch="${minor#*.}"
            minor="${minor%%.*}"
            major="${major%%.*}"
            range="${latest}..HEAD"
          fi
          bump="patch"
          if git log --format='%s%n%b' "$range" | grep -q 'BREAKING CHANGE'; then
            bump="major"
          elif git log --format='%s' "$range" | grep -Eq '^(feat|fix|perf)(\([^)]+\))?!:'; then
            bump="major"
          elif git log --format='%s' "$range" | grep -Eq '^(feat|fix|perf)(\([^)]+\))?:'; then
            bump="minor"
          fi
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          git log --pretty=format:'- %s (%h)' "$range" >> "$GITHUB_OUTPUT"
          echo >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "${{ steps.version.outputs.notes }}" \
            --target "${{ github.sha }}"
